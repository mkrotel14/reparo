name: Verify

on:
  pull_request:
    branches: [main, feat/**]

permissions:
  contents: read

jobs:
  test:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- --detectOpenHandles
      - run: npx tsc --noEmit

  web-export:
    name: Verify web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
